{% extends "badgeprint/base_nosidebar.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center py-4 py-md-5">
  <div class="col-12 col-sm-9 col-md-6 col-lg-4">

    <div class="text-center mb-4">
      <i class="bi bi-badge-cc-fill text-primary" style="font-size: 3rem;"></i>
      <h3 class="fw-bold mt-2 mb-1">BadgePrint</h3>
      <p class="text-muted small">Event badge printing &amp; check-in system</p>
    </div>

    <div class="card border-0 shadow rounded-3">
      <div class="card-body p-4 p-md-5">
        <h5 class="fw-semibold mb-4">Sign in to your account</h5>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Email address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted">
                <i class="bi bi-envelope"></i>
              </span>
              <input type="email" name="inputEmail" id="inputEmail"
                     class="form-control border-start-0 ps-0"
                     placeholder="you@example.com" required autofocus>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label text-muted small fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted">
                <i class="bi bi-lock"></i>
              </span>
              <input type="password" name="inputPassword" id="inputPassword"
                     class="form-control border-start-0 ps-0"
                     placeholder="Your password" required>
            </div>
          </div>
          <div class="mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="remember-me" id="rememberMe">
              <label class="form-check-label text-muted small" for="rememberMe">
                Remember me
              </label>
            </div>
          </div>
          <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
          </button>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
